services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: lapbot
      POSTGRES_USER: lapbot
      POSTGRES_PASSWORD: lapbot
    ports:
      - '5432:5432'
    volumes:
      - lapbot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lapbot -d lapbot']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  lapbot-postgres:
