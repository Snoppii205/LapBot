name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Format, Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Lint workspaces
        run: npm run lint

      - name: Run unit & contract tests
        env:
          DATABASE_URL: postgres://lapbot:lapbot@localhost:5432/lapbot
        run: npm test

      - name: Build production bundles
        run: npm run build

  build_image:
    name: Build & Push Docker Image (GHCR)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      web_image: ${{ steps.meta.outputs.web_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive GHCR image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "web_image=${REGISTRY}/${OWNER}/lapbot-web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image }}:latest
            ${{ steps.meta.outputs.web_image }}:${{ github.sha }}
          cache-from: type=gha,scope=lapbot-web
          cache-to: type=gha,mode=max,scope=lapbot-web

  deploy:
    name: Deploy to Production VPS (setiete.com)
    needs: build_image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          WEB_IMAGE: ${{ needs.build_image.outputs.web_image }}
          GIT_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          envs: GHCR_TOKEN,GHCR_USER,WEB_IMAGE,GIT_SHA,GITHUB_REPOSITORY
          script: |
            set -e
            mkdir -p /opt/lapbot/data/uploads
            chown -R 1000:1000 /opt/lapbot/data/uploads
            cd /opt/lapbot

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            if [ ! -d .git ]; then
              git init
              git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            fi

            git fetch --depth=1 "https://x-access-token:${GHCR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$GIT_SHA"
            git checkout -B main FETCH_HEAD
            git reset --hard FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$GIT_SHA"

            grep -v '^WEB_IMAGE=' .env > .env.tmp || true
            echo "WEB_IMAGE=${WEB_IMAGE}:${GIT_SHA}" >> .env.tmp
            mv .env.tmp .env
            chmod 600 .env

            export WEB_IMAGE="${WEB_IMAGE}:${GIT_SHA}"

            docker compose -f compose.prod.yaml pull web
            docker compose -f compose.prod.yaml run --rm web node apps/api/dist/db/migrate.js
            docker compose -f compose.prod.yaml up -d web
            docker image prune -f

            docker compose -f compose.prod.yaml ps
            for attempt in $(seq 1 20); do
              if curl -sf http://127.0.0.1:3005/api/v1/health/ready >/dev/null 2>&1; then
                echo "==> LapBot web is healthy and ready on 127.0.0.1:3005!"
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "ERROR: LapBot container did not become ready within 40 seconds." >&2
                docker compose -f compose.prod.yaml logs --tail 50 web
                exit 1
              fi
              sleep 2
            done
