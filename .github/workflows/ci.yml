name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Format, Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Lint workspaces
        run: npm run lint

      - name: Run unit & contract tests
        env:
          DATABASE_URL: postgres://lapbot:lapbot@localhost:5432/lapbot
        run: npm test

      - name: Build production bundles
        run: npm run build
